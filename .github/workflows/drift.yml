name: drift

# Everything so far verifies changes ON THE WAY IN. Nothing notices changes that
# arrive some other way: a console click, an Azure-side default, a Databricks
# feature enabling itself, someone debugging in prod at 2am.
#
# The repo is only the source of truth if something checks. This is that check.

on:
  schedule:
    # 03:00 UTC = 08:30 IST. Deliberately BEFORE the working day, so drift that
    # appeared overnight is waiting when people arrive rather than interrupting.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  # To raise an issue when drift is found.
  issues: write

env:
  ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  DATABRICKS_AUTH_TYPE: azure-cli
  TF_IN_AUTOMATION: "true"

jobs:
  detect:
    runs-on: ubuntu-latest

    strategy:
      # fail-fast: false, unlike the deploy workflow.
      #
      # There, a failed module means later ones cannot be trusted, so stopping is
      # right. Here we want the FULL picture of what drifted - stopping at the
      # first difference hides the rest, and you fix one thing only to rediscover
      # the others tomorrow.
      fail-fast: false
      max-parallel: 1
      matrix:
        module: [foundation, workspace, unity-catalog, jobs, governance]

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      # -detailed-exitcode is the whole mechanism:
      #   0 = no changes      1 = error      2 = drift
      #
      # Distinguishing 1 from 2 matters. A broken plan is an engineering problem;
      # drift is an operational one. Collapsing them into "the job went red"
      # means every alert needs a human to classify it before anyone can act.
      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "1" ]; then
            echo "### \`${{ matrix.module }}\` — PLAN FAILED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          terraform show -no-color tfplan > drift.txt
          if [ "$code" = "2" ]; then
            echo "### \`${{ matrix.module }}\` — DRIFT DETECTED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### \`${{ matrix.module }}\` — clean" >> "$GITHUB_STEP_SUMMARY"
          fi

      # One issue per module, REUSED rather than recreated.
      #
      # A nightly job that opens a fresh issue every run produces 30 identical
      # issues a month and trains everyone to ignore the label. Find the open one
      # and comment on it; only open a new one if none exists.
      - name: Raise or update drift issue
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const module = '${{ matrix.module }}';
            const title = `Drift detected: ${module}`;
            const plan = fs.readFileSync(`${module}/drift.txt`, 'utf8').slice(0, 55000);
            const body = [
              `Nightly drift check found differences between the repo and real infrastructure.`,
              ``,
              `Either something changed outside Terraform, or a change was merged without applying.`,
              ``,
              `<details><summary>terraform plan</summary>`,
              ``,
              '```terraform',
              plan,
              '```',
              ``,
              `</details>`,
              ``,
              `<sub>run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}</sub>`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift',
            });
            const match = existing.data.find(i => i.title === title);

            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['drift'],
              });
            }

      # Closes the issue when a module comes back clean, so the label reflects
      # CURRENT state rather than history. An alert that never clears is noise.
      - name: Close drift issue if clean
        if: steps.plan.outputs.exitcode == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Drift detected: ${{ matrix.module }}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift',
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: 'Drift resolved — module now matches the repo. Closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                state: 'closed',
              });
            }
