name: terraform

# PRs plan. Merges to main apply. That split is the entire safety model:
# nothing reaches Azure without review, and review sees the actual plan.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # THE line that makes secretless auth work. Without id-token: write, GitHub
  # will not mint an OIDC token and azure/login has nothing to exchange.
  id-token: write
  contents: read
  # So the plan can be posted back onto the PR.
  pull-requests: write
  # Lets the workflow publish its OWN check runs. An Actions job is already a
  # check run, but its Checks-tab pane only links out to the run page - it does
  # not render job summaries inline. A check run created through the Checks API
  # carries `output.summary`/`output.text`, and THAT renders in the pane.
  checks: write

env:
  ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
  # azurerm exchanges the GitHub OIDC token directly.
  ARM_USE_OIDC: "true"

  # The databricks provider does NOT. Left alone it performs its OWN token
  # exchange against Entra, requesting a GitHub token with its own audience -
  # and that pairing is not what our federated credential trusts, so Entra
  # returns AADSTS700213 naming a subject that is demonstrably correct. The
  # subject matches; the audience does not.
  #
  # azure/login has already authenticated the Azure CLI on this runner using the
  # federated credential that DOES work. Pointing the provider at that session
  # removes the second exchange entirely - one identity, one trust relationship,
  # nothing extra to keep in sync.
  DATABRICKS_AUTH_TYPE: azure-cli

  TF_IN_AUTOMATION: "true"

  # Where every module keeps its state. Only the upstream-state guard reads it
  # directly; Terraform gets it from each module's backend.tf.
  STATE_ACCOUNT: sttfstatebhanu7391

jobs:
  terraform:
    runs-on: ubuntu-latest
    name: terraform (${{ matrix.module }})

    # Modules run in DEPENDENCY ORDER, not in parallel. Each reads the previous
    # one's outputs through terraform_remote_state, so workspace cannot plan
    # until foundation has applied.
    #
    # max-parallel: 1 is doing real work here - a matrix would otherwise run
    # them concurrently and the later ones would fail reading state that does
    # not exist yet.
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        # Dependency order, and it is load-bearing. workspace reads foundation;
        # everything downstream reads workspace.
        #
        # FOUR of the nine root modules. What is missing, and why:
        #
        # data/catalog, data/pipelines, app/deploy and infra/compute ARE
        # DELIBERATELY ABSENT, and it is not a temporary omission.
        #
        # All four use the `databricks` provider, whose host is the workspace
        # URL. Since public_network_access_enabled = false, that name resolves
        # only inside the transit or workspace VNet. A GitHub-HOSTED runner is on
        # Microsoft public infrastructure, outside both, so those modules cannot
        # run there - not slowly, not with a token, not at all.
        #
        # The real fix is a SELF-HOSTED runner inside the VNet, which is exactly
        # why regulated organisations run their own runner fleets. Until then
        # they are applied from the jumpbox by hand, and CI covers the azurerm
        # modules, which reach ARM over the public internet and are unaffected.
        #
        # infra/compute would be absent anyway: applying it STARTS a cluster, and
        # a merge to main should not begin billing DBUs.
        #
        # infra/jumpbox is absent for a duller reason - it takes two variables
        # with no defaults, one of them a password. Putting a password in CI to
        # build the machine whose whole purpose is keeping CI out would be a
        # strange thing to do.
        #
        # governance is independent - it reads no other module's state - but runs
        # last so a subscription-level guardrail is never applied before the
        # things it guards exist.
        #
        # `requires` NAMES THE UPSTREAM STATE KEYS, and it exists because this
        # lab is torn down more often than it is up.
        #
        # A module that reads `terraform_remote_state` cannot plan until the
        # module it reads has been APPLIED. On a pull request nothing applies, so
        # with the lab destroyed, foundation plans against a network state whose
        # outputs are `{}` and dies with "this object does not have an attribute
        # named dns_zone_ids". That is a correct failure and a useless signal:
        # every PR goes red for a reason that has nothing to do with the diff,
        # and people stop reading the check.
        #
        # The guard below reads these blobs and decides between "your change is
        # broken" and "there is nothing here to plan against". Only the first is
        # worth failing over.
        include:
          - module: infra/network
            requires: ""
          - module: infra/foundation
            requires: "network.tfstate"
          - module: infra/workspace
            requires: "network.tfstate foundation.tfstate"
          - module: infra/governance
            requires: ""

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - uses: actions/checkout@v4

      # Logs the Azure CLI in via OIDC. The azurerm provider could manage
      # without this, but the databricks provider falls back to the CLI session
      # for workspace auth, so it is load-bearing here.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          # Wrapper off so `terraform plan -detailed-exitcode` exit codes reach
          # us intact rather than being swallowed.
          terraform_wrapper: false

      # fmt -check fails the build on unformatted code. Cheap, and it ends every
      # argument about formatting permanently.
      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      # IS THERE ANYTHING TO PLAN AGAINST?
      #
      # Note where this sits: AFTER fmt and validate, and before plan. Those two
      # check the diff itself and are worth running whether or not any
      # infrastructure exists - a badly formatted or invalid module should fail a
      # PR on an empty subscription just as loudly as on a full one.
      #
      # `terraform plan` is different. It needs the upstream module's OUTPUTS,
      # and a state file that exists but holds `"outputs": {}` is what a
      # destroyed module looks like. Terraform then fails with an attribute
      # error pointing at a line nobody touched.
      #
      # An empty state is not the same thing as a missing one, and neither is a
      # broken change. Reading the blob is the only way to tell them apart before
      # spending a plan on it.
      - name: Upstream state
        id: upstream
        run: |
          ready=true
          # Quoted into a variable first. An empty word list after `in` is legal in
          # bash 5 and a parse error in stricter shells; an empty VARIABLE simply
          # expands to zero words everywhere.
          requires="${{ matrix.requires }}"
          for key in $requires; do
            outputs=0
            if az storage blob download \
                 --account-name "${STATE_ACCOUNT}" \
                 --container-name tfstate \
                 --name "$key" \
                 --auth-mode login \
                 --file "/tmp/$key" \
                 --no-progress --output none 2>/dev/null; then
              outputs=$(jq -r '.outputs | length' "/tmp/$key" 2>/dev/null || echo 0)
            fi
            if [ "${outputs:-0}" -eq 0 ]; then
              echo "not applied: $key has no outputs"
              ready=false
            else
              echo "ready: $key has $outputs outputs"
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      # -detailed-exitcode: 0 = no changes, 2 = changes present, 1 = error.
      # Distinguishing "no drift" from "drift" from "broken" is what lets a
      # scheduled run become drift detection later.
      - name: Plan
        id: plan
        if: steps.upstream.outputs.ready == 'true'
        run: |
          set +e
          terraform plan -input=false -no-color -out=tfplan -detailed-exitcode
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "1" ]; then exit 1; fi
          terraform show -no-color tfplan > plan.txt

      # Renders into the right-hand pane of the PR's "Checks" tab, and onto the
      # job summary page. GITHUB_STEP_SUMMARY takes GitHub-flavoured markdown.
      #
      # Colour comes from a ```diff fence: GitHub's syntax highlighter paints
      # lines starting with + green, - red, and ! orange. That is the only
      # reliable way to get colour into a summary - inline HTML styling is
      # stripped, and there is no colour syntax in GFM.
      #
      # `terraform show -json` is what makes this possible at all. Never scrape
      # the human-readable plan text; it is explicitly not a stable interface,
      # whereas the JSON has a versioned schema.
      - name: Plan summary
        if: always()
        run: |
          M="${{ matrix.module }}"

          # THREE outcomes, not two, and the middle one is the point.
          #
          # "not applied" means the lab is torn down and this module has nothing
          # to plan against. It is reported and it is not a failure - the module
          # was still formatted and validated above. Collapsing it into "plan did
          # not complete" would put a red mark on every PR raised while the lab
          # is down, which is most of them.
          if [ "${{ steps.upstream.outputs.ready }}" != "true" ]; then
            {
              echo "## \`$M\`"
              echo ""
              echo "### ⏸️ Nothing to plan against"
              echo ""
              echo "Upstream state (\`${{ matrix.requires }}\`) holds no outputs, so this"
              echo "module has not been applied. Formatting and validation still ran."
              echo ""
              echo "This is what a torn-down lab looks like, not a broken change."
            } > summary.md
            cat summary.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ ! -f tfplan ]; then
            echo "### \`$M\` — plan did not complete" > summary.md
            cat summary.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          terraform show -json tfplan > plan.json

          # actions is an ARRAY: ["create"], ["update"], ["delete"], ["no-op"],
          # and ["delete","create"] for a replacement. Length > 1 means replace.
          q() { jq -r "$1" plan.json; }
          add=$(q '[.resource_changes[]? | select(.change.actions == ["create"])] | length')
          chg=$(q '[.resource_changes[]? | select(.change.actions == ["update"])] | length')
          del=$(q '[.resource_changes[]? | select(.change.actions == ["delete"])] | length')
          rep=$(q '[.resource_changes[]? | select((.change.actions | length) > 1)] | length')
          total=$((add + chg + del + rep))

          {
            echo "## \`$M\`"
            echo ""
            if [ "$total" -eq 0 ]; then
              echo "### ✅ No changes"
              echo ""
              echo "Real infrastructure matches the configuration."
            else
              echo "| 🟢 Add | 🟡 Change | ♻️ Replace | 🔴 Destroy |"
              echo "|:---:|:---:|:---:|:---:|"
              echo "| **$add** | **$chg** | **$rep** | **$del** |"
              echo ""
              echo "<details open><summary><b>Resources</b></summary>"
              echo ""
              echo '```diff'
              q '.resource_changes[]? | select(.change.actions != ["no-op"]) |
                 if   (.change.actions | length) > 1 then "! REPLACE  " + .address
                 elif .change.actions == ["create"]  then "+ CREATE   " + .address
                 elif .change.actions == ["update"]  then "~ UPDATE   " + .address
                 elif .change.actions == ["delete"]  then "- DESTROY  " + .address
                 else "  " + .address end'
              echo '```'
              echo ""
              echo "</details>"
            fi
            echo ""
            echo "<sub>Terraform $(terraform version -json | jq -r .terraform_version) · commit \`${GITHUB_SHA:0:7}\`</sub>"
          } > summary.md

          # Same content in two places: the job summary page, and (next step) a
          # check run that renders inside the PR's Checks tab.
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      # Publishes a check run whose body IS the plan, so selecting it in the
      # Checks sidebar renders the table in place instead of bouncing you to the
      # Actions run page.
      #
      # conclusion is always "neutral": this check REPORTS, it does not gate.
      # The gating is the `terraform (<module>)` job itself, which fails on a
      # broken plan. A reporting check that could turn a PR red would be a
      # second, confusing source of truth about whether the PR is mergeable.
      - name: Publish plan as a check run
        if: always() && hashFiles(format('{0}/summary.md', matrix.module)) != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('${{ matrix.module }}/summary.md', 'utf8');
            // On a PR, context.sha is the merge commit; the head SHA is what the
            // Checks tab is actually displaying, so the check must attach there.
            const sha = context.payload.pull_request
              ? context.payload.pull_request.head.sha
              : context.sha;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `plan: ${{ matrix.module }}`,
              head_sha: sha,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: `terraform plan — ${{ matrix.module }}`,
                // summary renders above text; both accept GitHub-flavoured
                // markdown, and text has a 64KB cap.
                summary: body.slice(0, 60000),
              },
            });

      # NOTE: there is deliberately no "comment the plan on the PR" step.
      #
      # Four modules commenting on every push buries the conversation, and the
      # same information now lives in the Checks tab where it belongs. Two copies
      # of the same thing is worse than either alone - people stop trusting both
      # once they disagree.

      # Apply ONLY from main, and only the plan file that was just reviewed.
      # Applying `tfplan` rather than re-planning means what runs is exactly what
      # was shown - no window for the world to change underneath you.
      #
      # The upstream guard is repeated here for a reason worth stating: on main
      # the modules run one at a time in dependency order, so by the time this
      # job starts, the module it depends on has ALREADY applied in the previous
      # job and its outputs exist. The guard therefore passes on main even when
      # it failed for the same commit on the PR, and the chain builds itself from
      # an empty subscription in one run.
      - name: Apply
        if: |
          github.ref == 'refs/heads/main'
          && github.event_name != 'pull_request'
          && steps.upstream.outputs.ready == 'true'
        run: terraform apply -input=false -auto-approve tfplan
