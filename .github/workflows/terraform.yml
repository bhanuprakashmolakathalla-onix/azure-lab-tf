name: terraform

# PRs plan. Merges to main apply. That split is the entire safety model:
# nothing reaches Azure without review, and review sees the actual plan.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # THE line that makes secretless auth work. Without id-token: write, GitHub
  # will not mint an OIDC token and azure/login has nothing to exchange.
  id-token: write
  contents: read
  # So the plan can be posted back onto the PR.
  pull-requests: write

env:
  ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
  # azurerm exchanges the GitHub OIDC token directly.
  ARM_USE_OIDC: "true"

  # The databricks provider does NOT. Left alone it performs its OWN token
  # exchange against Entra, requesting a GitHub token with its own audience -
  # and that pairing is not what our federated credential trusts, so Entra
  # returns AADSTS700213 naming a subject that is demonstrably correct. The
  # subject matches; the audience does not.
  #
  # azure/login has already authenticated the Azure CLI on this runner using the
  # federated credential that DOES work. Pointing the provider at that session
  # removes the second exchange entirely - one identity, one trust relationship,
  # nothing extra to keep in sync.
  DATABRICKS_AUTH_TYPE: azure-cli

  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    runs-on: ubuntu-latest

    # Modules run in DEPENDENCY ORDER, not in parallel. Each reads the previous
    # one's outputs through terraform_remote_state, so workspace cannot plan
    # until foundation has applied.
    #
    # max-parallel: 1 is doing real work here - a matrix would otherwise run
    # them concurrently and the later ones would fail reading state that does
    # not exist yet.
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        # Dependency order, and it is load-bearing. unity-catalog reads the
        # workspace module's outputs, and jobs reads them too - so unity-catalog
        # must sit after workspace. It goes before jobs by convention rather than
        # necessity: govern access first, then deploy things that use it.
        #
        # `compute` is deliberately absent. It starts a cluster, and a merge to
        # main should not begin billing DBUs.
        module: [foundation, workspace, unity-catalog, jobs]

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - uses: actions/checkout@v4

      # Logs the Azure CLI in via OIDC. The azurerm provider could manage
      # without this, but the databricks provider falls back to the CLI session
      # for workspace auth, so it is load-bearing here.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          # Wrapper off so `terraform plan -detailed-exitcode` exit codes reach
          # us intact rather than being swallowed.
          terraform_wrapper: false

      # fmt -check fails the build on unformatted code. Cheap, and it ends every
      # argument about formatting permanently.
      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      # -detailed-exitcode: 0 = no changes, 2 = changes present, 1 = error.
      # Distinguishing "no drift" from "drift" from "broken" is what lets a
      # scheduled run become drift detection later.
      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -out=tfplan -detailed-exitcode
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "1" ]; then exit 1; fi
          terraform show -no-color tfplan > plan.txt

      # Renders into the right-hand pane of the PR's "Checks" tab, and onto the
      # job summary page. GITHUB_STEP_SUMMARY takes GitHub-flavoured markdown.
      #
      # Colour comes from a ```diff fence: GitHub's syntax highlighter paints
      # lines starting with + green, - red, and ! orange. That is the only
      # reliable way to get colour into a summary - inline HTML styling is
      # stripped, and there is no colour syntax in GFM.
      #
      # `terraform show -json` is what makes this possible at all. Never scrape
      # the human-readable plan text; it is explicitly not a stable interface,
      # whereas the JSON has a versioned schema.
      - name: Plan summary
        if: always()
        run: |
          M="${{ matrix.module }}"
          if [ ! -f tfplan ]; then
            echo "### \`$M\` — plan did not complete" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          terraform show -json tfplan > plan.json

          # actions is an ARRAY: ["create"], ["update"], ["delete"], ["no-op"],
          # and ["delete","create"] for a replacement. Length > 1 means replace.
          q() { jq -r "$1" plan.json; }
          add=$(q '[.resource_changes[]? | select(.change.actions == ["create"])] | length')
          chg=$(q '[.resource_changes[]? | select(.change.actions == ["update"])] | length')
          del=$(q '[.resource_changes[]? | select(.change.actions == ["delete"])] | length')
          rep=$(q '[.resource_changes[]? | select((.change.actions | length) > 1)] | length')
          total=$((add + chg + del + rep))

          {
            echo "## \`$M\`"
            echo ""
            if [ "$total" -eq 0 ]; then
              echo "### ✅ No changes"
              echo ""
              echo "Real infrastructure matches the configuration."
            else
              echo "| 🟢 Add | 🟡 Change | ♻️ Replace | 🔴 Destroy |"
              echo "|:---:|:---:|:---:|:---:|"
              echo "| **$add** | **$chg** | **$rep** | **$del** |"
              echo ""
              echo "<details open><summary><b>Resources</b></summary>"
              echo ""
              echo '```diff'
              q '.resource_changes[]? | select(.change.actions != ["no-op"]) |
                 if   (.change.actions | length) > 1 then "! REPLACE  " + .address
                 elif .change.actions == ["create"]  then "+ CREATE   " + .address
                 elif .change.actions == ["update"]  then "~ UPDATE   " + .address
                 elif .change.actions == ["delete"]  then "- DESTROY  " + .address
                 else "  " + .address end'
              echo '```'
              echo ""
              echo "</details>"
            fi
            echo ""
            echo "<sub>Terraform $(terraform version -json | jq -r .terraform_version) · commit \`${GITHUB_SHA:0:7}\`</sub>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ matrix.module }}/plan.txt', 'utf8');
            const changed = '${{ steps.plan.outputs.exitcode }}' === '2';
            // GitHub comments cap at 65536 chars; a big plan must be truncated.
            const body = changed
              ? `### \`${{ matrix.module }}\` — changes planned\n\n<details><summary>Show plan</summary>\n\n\`\`\`terraform\n${plan.slice(0, 60000)}\n\`\`\`\n\n</details>`
              : `### \`${{ matrix.module }}\` — no changes`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      # Apply ONLY from main, and only the plan file that was just reviewed.
      # Applying `tfplan` rather than re-planning means what runs is exactly what
      # was shown - no window for the world to change underneath you.
      - name: Apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan
